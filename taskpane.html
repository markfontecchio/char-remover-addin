<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Remover</title>

  <!-- Office JS SDK -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #201f1e;
      background: #faf9f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: #0078d4;
      color: #fff;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 4px rgba(0,0,0,.18);
    }
    .header svg { flex-shrink: 0; }
    .header-text h1 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }
    .header-text p {
      font-size: 11px;
      opacity: .85;
      margin-top: 2px;
    }

    /* ── Main content ── */
    .content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    /* ── Section card ── */
    .card {
      background: #fff;
      border: 1px solid #edebe9;
      border-radius: 6px;
      padding: 14px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #605e5c;
      margin-bottom: 10px;
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .char-input {
      flex: 1;
      border: 1px solid #c8c6c4;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 18px;          /* large so emojis render clearly */
      line-height: 1.4;
      outline: none;
      transition: border-color .15s;
      background: #fff;
      min-width: 0;
    }
    .char-input:focus {
      border-color: #0078d4;
      box-shadow: 0 0 0 2px rgba(0,120,212,.2);
    }
    .char-input::placeholder {
      font-size: 13px;
      color: #a19f9d;
    }
    .btn-add {
      flex-shrink: 0;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 14px;
      font-size: 20px;
      font-weight: 300;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .btn-add:hover  { background: #106ebe; }
    .btn-add:active { background: #005a9e; }

    /* ── Tag list ── */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 36px;
      padding: 6px 8px;
      border: 1px dashed #c8c6c4;
      border-radius: 4px;
      background: #f3f2f1;
      align-content: flex-start;
    }
    .tag-list.empty::before {
      content: "No characters added yet.";
      color: #a19f9d;
      font-size: 12px;
      align-self: center;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #deecf9;
      border: 1px solid #c7e0f4;
      border-radius: 20px;
      padding: 3px 10px 3px 8px;
      font-size: 16px;
      line-height: 1.3;
      user-select: none;
    }
    .tag-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #605e5c;
      font-size: 14px;
      line-height: 1;
      padding: 0 0 0 2px;
      display: flex;
      align-items: center;
      transition: color .1s;
    }
    .tag-remove:hover { color: #a4262c; }

    /* ── Options ── */
    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .option-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #0078d4;
    }
    .option-row label { cursor: pointer; }

    /* ── Action buttons ── */
    .btn-remove {
      width: 100%;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-remove:hover  { background: #106ebe; }
    .btn-remove:active { background: #005a9e; }
    .btn-remove:disabled {
      background: #c8c6c4;
      cursor: not-allowed;
    }

    .btn-clear-all {
      width: 100%;
      background: transparent;
      color: #a4262c;
      border: 1px solid #a4262c;
      border-radius: 4px;
      padding: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-clear-all:hover {
      background: #a4262c;
      color: #fff;
    }

    /* ── Status / result banner ── */
    .status {
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }
    .status.show { display: block; }
    .status.success {
      background: #dff6dd;
      border: 1px solid #107c10;
      color: #0b5a08;
    }
    .status.error {
      background: #fde7e9;
      border: 1px solid #a4262c;
      color: #6e0811;
    }
    .status.info {
      background: #deecf9;
      border: 1px solid #0078d4;
      color: #004578;
    }

    /* ── Spinner ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn-remove.loading .spinner { display: inline-block; }
    .btn-remove.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px;
      font-size: 11px;
      color: #a19f9d;
      text-align: center;
      border-top: 1px solid #edebe9;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <rect width="28" height="28" rx="5" fill="rgba(255,255,255,0.15)"/>
      <text x="5" y="21" font-size="17" fill="white">✂️</text>
    </svg>
    <div class="header-text">
      <h1>Character Remover</h1>
      <p>Remove special characters &amp; emojis</p>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- Step 1: Add characters -->
    <div class="card">
      <div class="card-title">Step 1 — Add characters to remove</div>

      <div class="input-row">
        <input
          id="charInput"
          class="char-input"
          type="text"
          placeholder="Type or paste a character / emoji…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-add" id="btnAdd" title="Add character" aria-label="Add character">+</button>
      </div>

      <p style="font-size:11px;color:#605e5c;margin:6px 0 10px;">
        You can type multiple characters in the box at once (e.g. <strong>😀🔥★</strong>) and they will each be added as separate entries.
      </p>

      <!-- Tag list -->
      <div class="tag-list empty" id="tagList" aria-label="Characters to remove" aria-live="polite"></div>
    </div>

    <!-- Step 2: Options -->
    <div class="card">
      <div class="card-title">Step 2 — Options</div>

      <div class="option-row">
        <input type="checkbox" id="optAllSheets" />
        <label for="optAllSheets">
          <strong>Excel:</strong> Apply to all worksheets (not just the active sheet)
        </label>
      </div>
    </div>

    <!-- Step 3: Remove -->
    <div class="card">
      <div class="card-title">Step 3 — Remove</div>

      <button class="btn-remove" id="btnRemove" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Remove Characters from Document</span>
      </button>

      <div style="height:8px;"></div>

      <button class="btn-clear-all" id="btnClearAll">
        Clear All Added Characters
      </button>
    </div>

    <!-- Status message -->
    <div class="status" id="statusBox" role="alert" aria-live="assertive"></div>

  </div>

  <!-- Footer -->
  <div class="footer">Works in Microsoft Word &amp; Excel</div>

  <!-- Main logic -->
  <script src="src/taskpane.js"></script>

</body>
</html>
